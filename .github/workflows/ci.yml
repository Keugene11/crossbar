name: CI

on:
  push:
    branches: [main]
  pull_request:

# pnpm refuses interactive prompts without this; CI runners have no TTY.
env:
  CI: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose -- the action reads `packageManager`
      # from package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Covers both the gateway and the serverless entrypoint: Vercel
      # type-checks api/ against the root tsconfig, and that drifted once.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Runs against the in-process fake upstream: no network, no ports,
      # no provider credentials, no spend.
      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit
